name: Build Android APK (Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Check Expo SDK health
        run: npx -y expo-doctor

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # No "Setup Android SDK" step: ubuntu-latest runners already ship a full
      # Android SDK (ANDROID_HOME set, licenses accepted). The
      # android-actions/setup-android action is broken — it tries to install
      # the obsolete 'tools' package ("Failed to find package 'tools'").

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: android/app/build/outputs/apk/release/app-*-release.apk

      - name: Rename APKs with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "MyWeather-${{ github.ref_name }}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "MyWeather-${{ github.ref_name }}-armeabi-v7a.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MyWeather-${{ github.ref_name }}-*.apk
          generate_release_notes: true
