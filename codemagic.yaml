scripts:
      - name: Install dependencies
        script: |
          npm install
          
      - name: Build Android APK
        script: |
          # Сначала переходим в папку android!
          cd android 
          chmod +x gradlew
          # Собираем Debug версию (она проще и не требует подписи)
          ./gradlew assembleDebug
          
    artifacts:
      # Путь к артефакту тоже должен вести в папку debug
      - android/app/build/outputs/apk/debug/*.apk
