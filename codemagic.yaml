workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          rm -rf android
          npx expo prebuild --platform android --clean
          
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK (Patched Gradle)
        script: |
          # 1. Генерируем бандл через expo export
          npx expo export --platform android --output-dir dist
          
          # 2. Кладем его в assets
          mkdir -p android/app/src/main/assets
          cp dist/bundles/index.android.bundle android/app/src/main/assets/index.android.bundle
          
          # 3. ВАЖНО: Внедряем патч в build.gradle, чтобы ОТКЛЮЧИТЬ авто-бандлинг
          cd android/app
          
          # Добавляем блок отключения авто-бандлинга, если его еще нет
          if ! grep -q "disableAutoBundling" build.gradle; then
            echo "" >> build.gradle
            echo "// PATCH: Disable automatic JS bundling for offline build" >> build.gradle
            echo "tasks.whenTaskAdded { task ->" >> build.gradle
            echo "    if (task.name == 'bundleDebugJsAndAssets' || task.name == 'bundleReleaseJsAndAssets') {" >> build.gradle
            echo "        task.enabled = false" >> build.gradle
            echo "    }" >> build.gradle
            echo "}" >> build.gradle
          fi
          
          cd ..
          chmod +x gradlew
          
          # 4. Собираем APK. Патч заблокирует попытку Gradle перезаписать бандл.
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
