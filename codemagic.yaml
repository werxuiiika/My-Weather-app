workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install deps
        script: |
          npm install
      - name: Prebuild Android (Update existing)
        script: |
          # Обновляем нативные файлы, но НЕ удаляем папку android
          npx expo prebuild --platform android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
