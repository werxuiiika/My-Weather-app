workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20 # ВАЖНО: Обновляем Node.js до версии 20 для совместимости с RN 0.81
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          rm -rf android
          npx expo prebuild --platform android --clean
          
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK (Manual Bundle with Node 20)
        script: |
          # 1. Генерируем бандл через expo export (теперь это работает на Node 20)
          npx expo export --platform android --output-dir dist
          
          # 2. Явно копируем бандл в папку assets Android-проекта
          mkdir -p android/app/src/main/assets
          cp dist/bundles/index.android.bundle android/app/src/main/assets/index.android.bundle
          
          # Проверяем, что файл действительно скопировался и имеет размер > 0
          ls -lh android/app/src/main/assets/index.android.bundle
          
          # 3. Собираем APK. 
          # Мы НЕ используем флаг -x, так как задачи bundleDebugJsAndAssets нет в SDK 54.
          # Gradle увидит файл в assets и просто упакует его в APK.
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
