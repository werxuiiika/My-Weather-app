workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          rm -rf android
          npx expo prebuild --platform android --clean
          
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK (Manual Bundle)
        script: |
          # 1. Создаем папку assets
          mkdir -p android/app/src/main/assets
          
          # 2. ГЕНЕРИРУЕМ БАНДЛ ВРУЧНУЮ
          # Используем стандартную точку входа Expo
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          
          # 3. Собираем APK, ОТКЛЮЧИВ задачу бандлинга в Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x bundleDebugJsAndAssets
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
