workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          npx expo install expo-location
          
          # УДАЛЯЕМ ПРОБЛЕМНЫЙ ФАЙЛ ПЕРЕД PREBUILD (на всякий случай)
          rm -f recovered_bundle.js
          
          rm -rf android
          npx expo prebuild --platform android
          
          # Восстанавливаем colors.xml ИЗ GIT после prebuild
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build APK with Safe Bundle
        script: |
          cd android
          chmod +x gradlew
          
          # Создаем папку assets и копируем туда БЕЗОПАСНЫЙ бандл
          mkdir -p app/src/main/assets
          cp ../safe_bundle.js app/src/main/assets/index.android.bundle
          
          # Собираем APK. 
          # Мы НЕ используем флаг -x, так как задачи нет.
          # Мы полагаемся на то, что Metro не найдет исходников в корне 
          # (так как App.js теперь пустой/заглушка) и возьмет готовый бандл из assets.
          # Если Metro все же запустится и упадет - мы добавим .babelrc для игнора.
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
