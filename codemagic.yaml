workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          # Очищаем и генерируем нативный код заново
          rm -rf android
          npx expo prebuild --platform android --clean
          
          # Восстанавливаем кастомные цвета
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK (Force Bundle)
        script: |
          cd android
          chmod +x gradlew
          
          # Создаем папку assets, если её нет
          mkdir -p app/src/main/assets
          
          # ГЕНЕРИРУЕМ БАНДЛ ПРЯМО СЮДА через react-native CLI
          # Это гарантированно создаст правильный index.android.bundle
          cd ..
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          
          # Теперь собираем APK. Бандл уже лежит где надо.
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
