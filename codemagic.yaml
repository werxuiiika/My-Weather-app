workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          npx expo install expo-location
          
          # УДАЛЯЕМ ПРОБЛЕМНЫЙ ФАЙЛ ПЕРЕД PREBUILD
          rm -f recovered_bundle.js
          
          rm -rf android
          npx expo prebuild --platform android
          
          # Восстанавливаем colors.xml ИЗ GIT после prebuild
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build APK with Safe Bundle
        script: |
          cd android
          chmod +x gradlew
          
          # Создаем папку assets и копируем туда БЕЗОПАСНЫЙ бандл
          mkdir -p app/src/main/assets
          cp ../safe_bundle.js app/src/main/assets/index.android.bundle
          
          # Собираем APK БЕЗ Metro (флаг -x отключает задачу бандлинга)
          ./gradlew assembleDebug -x bundleReleaseJsAndAssets -x createBundleReleaseJsAndAssets
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
