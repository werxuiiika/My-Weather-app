workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          rm -rf android
          npx expo prebuild --platform android --clean
          
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK (Safe Bundle)
        script: |
          # 1. Генерируем бандл через expo export (это надежно работает на сервере)
          npx expo export --platform android --output-dir dist
          
          # 2. Копируем готовый бандл в папку assets Android-проекта
          mkdir -p android/app/src/main/assets
          cp dist/bundles/index.android.bundle android/app/src/main/assets/index.android.bundle
          
          # 3. Собираем APK. 
          # Мы НЕ используем флаг -x, так как задачи нет.
          # Gradle увидит файл в assets и просто упакует его.
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
