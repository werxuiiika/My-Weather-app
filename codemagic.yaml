workflows:
  android-gradle-build:
    name: My Weather App Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    
    environment:
      vars:
        PACKAGE_NAME: "com.bladvin.myweatherapp"
        
    scripts:
      - name: Install dependencies
        script: |
          npm install
          
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      
    publishing:
      email:
        recipients:
          - user@example.com
