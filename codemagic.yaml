workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          # Удаляем старую папку android, чтобы избежать конфликтов путей
          rm -rf android
          # Генерируем новую. Флаг --yes отвечает "да" на все вопросы автоматически
          npx expo prebuild --platform android --yes
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
