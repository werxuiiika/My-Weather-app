workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
      # Передаем имя пакета явно для prebuild
      vars:
        EXPO_ANDROID_PACKAGE: "com.bladvin.myappfinal"
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          rm -rf android
          # Убрали --yes, добавили попытку передать пакет
          npx expo prebuild --platform android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
