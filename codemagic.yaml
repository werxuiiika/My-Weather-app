workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies and prebuild
        script: |
          npm install
          npx expo install expo-location @react-native-community/netinfo
          
          # Очищаем и генерируем нативный код заново
          rm -rf android
          npx expo prebuild --platform android --clean
          
          # Восстанавливаем кастомные цвета (если они есть в git)
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          
          # 1. Создаем JS-бандл правильно через Expo CLI
          # Это создаст файл в папке dist/bundles/
          cd ..
          npx expo export --platform android --output-dir dist
          
          # Копируем созданный бандл в папку assets проекта Android
          mkdir -p android/app/src/main/assets
          cp dist/bundles/index.android.bundle android/app/src/main/assets/index.android.bundle
          
          # 2. Собираем APK. Теперь бандл уже лежит в assets, Gradle просто упакует его.
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
