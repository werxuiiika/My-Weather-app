workflows:
  android-release:
    name: My Weather App - Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 18
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          npx expo install expo-location
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify bundle in APK
        script: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK found: $APK_PATH"
          unzip -l "$APK_PATH" | grep "index.android.bundle" && echo "BUNDLE EMBEDDED OK" || echo "BUNDLE MISSING"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
