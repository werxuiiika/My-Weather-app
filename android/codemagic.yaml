workflows:
  android-build:
    name: My Weather App
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install deps & Prebuild
        script: |
          npm install
          npx expo install expo-location
          rm -rf android
          npx expo prebuild --platform android
          
          # Восстанавливаем colors.xml из репозитория, если prebuild его затер
          git checkout HEAD -- android/app/src/main/res/values/colors.xml || true

      - name: Bundle JS and Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebugJsAndAssets
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
